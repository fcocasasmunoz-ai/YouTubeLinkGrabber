name: LinkGrabber

on:
  schedule:
    - cron: '*/60 * * * *'

  pull_request_target:    # <--- Este cambio ya lo hiciste
    branches: [ main ]

  workflow_dispatch:

jobs:
  runCode:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4    # <--- CAMBIA ESTA LÍNEA (de @v2 a @v4)

      - name: Grab Link
        run: |
          git config --global user.email "fbk@hll.localhost"
          git config --global user.name "fbk"
          chmod +x exec_grabber.sh && ./exec_grabber.sh
          git add -A
          git commit -m "./youtubeLink.txt is updated."
          git push
